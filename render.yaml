services:
  - type: web
    name: todo-app
    env: docker
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: APP_KEY
        generateValue: true

databases:
  - name: todo-db
    type: postgres
    plan: free
    region: oregon
